<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cover als CSS-Grid</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
      }
      .bar {
        display: flex;
        gap: 12px;
        align-items: center;
        height: 48px;
        padding: 0 12px;
      }
      #grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
        height: calc(100vh - 48px);
        overflow-y: auto;
      }
      .cell {
        aspect-ratio: 3 / 4;
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <button data-n="60">60 Cover</button>
      <button data-n="10000">10.000 Cover</button>
    </div>
    <div id="grid"></div>
    <script type="module" src="/naive/naive.ts"></script>
  </body>
</html>
